name: build_and_test_epmt

on:
  push:
  pull_request:

# thank you m. lee
# cancel running jobs if theres a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    services:
      postgres: latest
      image: postgres:15
      env:
        POSTGRES_USER: epmt
        POSTGRES_PASSWORD: Goal2020
        POSTGRES_DB: epmt
      ports:
        - 5432:5432
      options: >-
        --health-cmd="pg_isready -U testuser"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5

    container:
      image: rockylinux:8
      env:
        POSTGRES_DB: 'EPMT'
        POSTGRES_USER: 'postgres'
        POSTGRES_PASSWORD: 'example'
        PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
      options: --privileged

    steps:
      - uses: actions/checkout@v4
      - name: yum install and update
        run: |
          yum update -y
          yum install -y findutils unzip bash tcsh nc curl make git gcc postgresql-devel zlib-devel bzip2 bzip2-devel readline-devel sqlite-devel openssl-devel xz xz-devel libffi-devel

      - name: Test connection
        run: |
          pg_isready -h localhost -U testuser